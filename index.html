<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Locked in the computer room</title>
<style>
:root{
  --bg:#05050a; --panel:#141420; --panel2:#1d1d2c; --line:#3a3a52; --tx:#fff; --mut:#c9cadb;
  --pink:#ff5fa2; --lime:#a6f04a; --sky:#4cc9ff; --sun:#ffd23f; --grape:#b08cff; --coral:#ff7a59; --mint:#3ee0b0; --amber:#ffb020;
  --good:#3ee08f; --bad:#ff5c7a;
  --disp:"Segoe UI Black","Arial Black","Segoe UI",Carlito,Calibri,system-ui,sans-serif;
  --body:Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"Lucida Console","DejaVu Sans Mono","Courier New",monospace;
  --hand:"Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE",Calibri,cursive;
}
*{box-sizing:border-box}
html{font-size:24px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);line-height:1.3;padding-bottom:calc(4.4em + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.disp{font-family:var(--disp);font-weight:900}
.mut{color:var(--mut)}
.wrap{max-width:1150px;margin:0 auto;padding:.5em .6em}
.row{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.btn{border:3px solid #fff;background:transparent;border-radius:12px;min-height:2.3em;padding:.2em .9em;font-weight:700;font-size:1em}
.btn.go{background:var(--sun);color:#111;border-color:var(--sun)}
.btn.sm{min-height:44px;font-size:.85em;padding:0 .6em}
.hint{background:#2b2410;border:3px solid var(--sun);border-radius:12px;padding:.35em .7em;margin:.5em 0}
.yes{background:#0f2a1c;border:3px solid var(--good);border-radius:12px;padding:.35em .7em;margin:.5em 0}
.warnbox{background:#3a1520;border:3px solid var(--bad);border-radius:12px;padding:.4em .8em;margin:.6em 0}
.banner{background:var(--lime);color:#111;font-weight:700;border-radius:12px;padding:.4em .8em;margin:.4em 0}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}70%{transform:scale(1.12) rotate(5deg)}100%{transform:none}}
@keyframes blink{50%{opacity:0}}
.caret{display:inline-block;width:.5em;height:1em;background:var(--lime);vertical-align:-.15em;animation:blink 1s steps(1) infinite}

/* boot */
.boot{position:relative;border-radius:18px;overflow:hidden;margin:.6em 0;border:3px solid var(--line);background:#000;min-height:11em;padding:1em}
.boot .fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:flick 2.2s 1}
@keyframes flick{0%{opacity:.9}8%{opacity:0}14%{opacity:.6}20%{opacity:0}30%{opacity:.3}36%{opacity:0}100%{opacity:0}}
.boot p{margin:.2em 0;font-family:var(--mono);font-size:.95em}
.boot .ok{color:var(--good)} .boot .err{color:var(--bad)} .boot .warn{color:var(--sun)}
.title{font-family:var(--disp);font-weight:900;font-size:2.1em;line-height:1.05;margin:.2em 0;background:linear-gradient(90deg,var(--pink),var(--sun),var(--lime),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:.8em 1em;margin:.7em 0}
.gin{font:inherit;font-size:1em;background:#000;color:#fff;border:3px solid var(--sky);border-radius:10px;min-height:2.2em;padding:.1em .6em;flex:1 1 10em;min-width:0}

/* room */
.roomhead{display:flex;flex-wrap:wrap;gap:.4em;align-items:center;justify-content:space-between;margin:.2em 0 .4em}
.roomhead h1{font-family:var(--disp);font-weight:900;font-size:1.2em;margin:0}
.scene{position:relative;border-radius:18px;overflow:hidden;border:3px solid var(--line);background:#000}
.scene svg{display:block;width:100%;height:auto}
.hs{cursor:pointer}
.hs .ring{fill:transparent;stroke:#fff;stroke-width:3;stroke-dasharray:8 6;opacity:.55}
.hs:hover .ring,.hs:focus .ring{opacity:1;stroke:var(--sun)}
.hs.fixed .ring{stroke:var(--good);stroke-dasharray:none;opacity:1;stroke-width:5}
.hs .tag{font-family:var(--body);font-weight:700;font-size:22px;fill:#111}
.hs .tagbg{fill:var(--sun)}
.hs.fixed .tagbg{fill:var(--good)}
.hs.broken .wob{animation:wob 2.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes wob{0%,86%,100%{transform:none}90%{transform:rotate(-8deg)}94%{transform:rotate(8deg)}}
.dark{pointer-events:none;transition:opacity 1s}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(9.5em,100%),1fr));gap:.5em;margin-top:.7em}
.stn{display:flex;align-items:center;gap:.5em;text-align:left;border:3px solid var(--c);background:var(--panel);border-radius:14px;padding:.35em .55em;min-height:2.8em}
.stn .e{font-size:1.5em;flex:none}
.stn .n{font-weight:700;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.stn .s{display:block;font-size:.72em;color:var(--mut);font-weight:400}
.stn.fixed{background:#0f2a1c;border-color:var(--good)}
.stn .lt{margin-left:auto;background:var(--sun);color:#111;font-family:var(--disp);font-weight:900;border-radius:8px;min-width:1.5em;text-align:center;flex:none}

/* station frame */
.st{border-radius:18px;border:3px solid var(--c);overflow:hidden;margin:.3em 0 .8em;background:var(--panel)}
.sth{display:flex;align-items:center;gap:.5em;background:var(--c);color:#111;padding:.3em .4em .3em .7em}
.sth .t{flex:1;font-family:var(--disp);font-weight:900;font-size:1.05em;min-width:0}
.sth .x{background:#111;color:#fff;border:0;border-radius:10px;min-width:44px;min-height:44px;font-weight:900}
.stb{padding:.7em .8em}
.story{font-style:italic;color:var(--mut);margin:0 0 .4em}
.goal{border-left:8px solid var(--c);background:var(--panel2);border-radius:8px;padding:.35em .7em;margin:.2em 0 .6em;font-weight:700}
.bulbs{display:flex;gap:.3em;margin:.2em 0 .6em;flex-wrap:wrap}
.bulbs span{font-size:1.3em;filter:grayscale(1) brightness(.5)}
.bulbs span.on{filter:none;text-shadow:0 0 12px var(--sun)}
.fixedmsg{text-align:center;padding:.6em 0}
.fixedmsg .big{font-family:var(--disp);font-weight:900;font-size:1.5em}
.letter{display:inline-flex;align-items:center;justify-content:center;width:2.3em;height:2.3em;margin:.3em;border-radius:6px;background:var(--sun);color:#111;font-family:var(--disp);font-weight:900;font-size:2em;animation:pop .7s;transform:rotate(-4deg);box-shadow:4px 6px 0 rgba(0,0,0,.5)}

/* 1 monitors */
.mons{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(8.6em,46%),1fr));gap:.6em}
.mon{border:0;background:transparent;padding:0;text-align:center}
.mon .bez{background:#2b2b38;border-radius:12px;padding:.35em;border:3px solid #444}
.mon.sel .bez{border-color:var(--sun);box-shadow:0 0 0 4px rgba(255,210,63,.35)}
.mon.ok .bez{border-color:var(--good)}
.mon .scr{height:4.4em;border-radius:6px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.8em;color:#111;background:#dfe9ff}
.mon .stand{width:30%;height:.5em;background:#444;margin:0 auto;border-radius:0 0 6px 6px}
.mon .who{font-size:.72em;color:var(--mut);margin-top:.15em;line-height:1.15}
.scr .bigi{font-size:1.9em;line-height:1}
.sym-frozen{background:linear-gradient(135deg,#dff4ff,#b6dcff)!important}
.sym-frozen:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(60deg,rgba(255,255,255,.55) 0 3px,transparent 3px 14px)}
.sym-crash{background:#000!important;color:#ff6b6b!important;animation:flk 1.2s infinite}
@keyframes flk{0%,40%,100%{opacity:1}45%,55%{opacity:.15}}
.sym-loading{background:#fff!important}
.spin{width:1.8em;height:1.8em;border:5px solid #ccc;border-top-color:#2f6fe0;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sym-down{background:#fde8e8!important}
.sym-glitch{background:#e9e0ff!important;animation:gl 1.6s infinite}
@keyframes gl{0%,70%,100%{transform:none;filter:none}74%{transform:translateX(-4px) skewX(8deg);filter:hue-rotate(120deg)}78%{transform:translateX(4px)}82%{opacity:.4}}
.sym-out{background:#eef0f6!important}
.sym-slow{background:#fff!important}
.slowbar{width:80%;height:.6em;border:2px solid #333;border-radius:4px;overflow:hidden}
.slowbar i{display:block;height:100%;width:3%;background:#2f6fe0;animation:crawl 9s linear infinite}
@keyframes crawl{to{width:22%}}
.sym-pw{background:#fff!important}
.sym-ok{background:#0f2a1c!important;color:var(--good)!important;font-weight:900}
.stickies{display:flex;flex-wrap:wrap;gap:.5em;margin-top:.5em}
.sticky{border:0;color:#111;font-weight:700;padding:.45em .7em;min-height:44px;box-shadow:3px 5px 0 rgba(0,0,0,.45);font-family:var(--hand);font-size:.95em}
.sticky:nth-child(4n+1){background:#ffe66d;transform:rotate(-2deg)} .sticky:nth-child(4n+2){background:#ffadd6;transform:rotate(2deg)}
.sticky:nth-child(4n+3){background:#a9f0c8;transform:rotate(-1deg)} .sticky:nth-child(4n){background:#9fdcff;transform:rotate(1.5deg)}

/* 2 printer */
.printer{max-width:26em;margin:.2em auto 0;position:relative}
.ptop{background:linear-gradient(#d9d9e2,#a9a9b8);height:3.2em;border-radius:16px 16px 6px 6px;border:3px solid #555;display:flex;align-items:center;justify-content:space-between;padding:0 .8em;color:#111;font-weight:900}
.ptop .led{width:.7em;height:.7em;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);animation:blink 1.2s infinite}
.pslot{height:.6em;background:#222;margin:0 1.2em;border-radius:0 0 8px 8px}
.paper{background:#fffdf5;color:#222;margin:0 2em;padding:.7em .9em 1em;font-family:var(--hand);font-size:1.05em;min-height:5em;border-radius:0 0 6px 6px;box-shadow:0 6px 0 rgba(0,0,0,.35);animation:print 1.1s ease-out;background-image:repeating-linear-gradient(#fffdf5 0 1.45em,#d9e6ff 1.45em 1.5em)}
.paper b{font-family:var(--body)}
@keyframes print{from{transform:translateY(-70%);clip-path:inset(70% 0 0 0)}to{transform:none;clip-path:inset(0 0 0 0)}}
.replies{display:flex;flex-direction:column;gap:.45em;margin-top:.4em}
.reply{display:flex;gap:.6em;align-items:center;text-align:left;border:3px solid var(--c);background:var(--panel2);border-radius:18px 18px 18px 4px;padding:.35em .8em;min-height:2.3em}
.reply .k{flex:none;width:1.5em;height:1.5em;border-radius:50%;background:var(--c);color:#111;font-weight:900;display:flex;align-items:center;justify-content:center}
.fly{animation:fly .9s forwards}
@keyframes fly{to{transform:translate(120%,-140%) rotate(40deg) scale(.4);opacity:0}}

/* 3 projector */
.proj{position:relative;padding-top:2.6em}
.pbox{position:absolute;top:0;left:50%;transform:translateX(-50%);width:5em;height:2em;background:#3a3a48;border-radius:10px;border:3px solid #666}
.pbox:after{content:"";position:absolute;right:.5em;top:.45em;width:.8em;height:.8em;border-radius:50%;background:#bfe8ff;box-shadow:0 0 14px #bfe8ff}
.beam{position:absolute;top:1.9em;left:50%;transform:translateX(-50%);width:90%;height:4em;background:linear-gradient(rgba(191,232,255,.35),rgba(191,232,255,.05));clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);pointer-events:none}
.pscreen{background:#eef2f7;border:6px solid #ccc;border-top-width:14px;border-radius:4px;padding:1em;min-height:9em;display:flex;align-items:center;justify-content:center;animation:pon .8s}
@keyframes pon{0%{opacity:0}30%{opacity:.6}40%{opacity:.1}60%{opacity:1}}
.dlg{width:100%;max-width:26em;background:#fff;color:#111;border-radius:12px;border:3px solid #111;box-shadow:0 8px 0 rgba(0,0,0,.25);padding:.7em .9em}
.dlg .dt{font-weight:900;font-size:1.1em}
.dlg .dbtns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.4em;margin-top:.6em}
.dlg .db{border:3px solid #111;background:#fff;border-radius:8px;min-height:44px;padding:0 .9em;font-weight:700;color:#111}
.dlg .db.p{background:#111;color:#fff}

/* 4 whiteboard */
.wb{background:#f7f9fb;color:#1a1a1a;border:10px solid #b9bfca;border-radius:10px;padding:.6em .8em;position:relative;box-shadow:inset 0 0 30px rgba(0,0,0,.08)}
.wb .wbt{font-family:var(--hand);font-size:1.2em;color:#1f4fbf;margin-bottom:.2em}
.wline{display:flex;align-items:center;gap:.5em;min-height:2em;border-bottom:2px dashed #c8cdd6;font-family:var(--hand)}
.wline .num{color:#d62828;font-size:1.3em;font-weight:900;width:1.4em}
.wline .placed{background:#ffe66d;border-radius:999px;padding:.1em .8em;box-shadow:2px 3px 0 rgba(0,0,0,.2);animation:pop .5s;font-family:var(--body)}
.mags{display:flex;flex-wrap:wrap;gap:.55em;margin-top:.5em}
.mag{max-width:100%;text-align:left;overflow-wrap:anywhere;border:0;border-radius:999px;padding:.35em .9em;min-height:44px;font-weight:700;color:#111;box-shadow:3px 5px 0 rgba(0,0,0,.45)}
.mag:before{content:"●";margin-right:.35em;color:rgba(0,0,0,.35)}

/* 5 keyboard */
.monbig{background:#2b2b38;border:4px solid #444;border-radius:14px;padding:.5em;max-width:34em;margin:0 auto}
.monbig .scr{background:#0b1020;border-radius:6px;padding:.5em .7em;min-height:4.2em}
.monbig .lab{font-family:var(--body);font-size:.75em;color:#9fb3d9}
.screenline{font-family:var(--mono);font-size:1.25em;color:#e8f0ff;overflow-wrap:anywhere;min-height:1.4em}
.kb{display:flex;flex-direction:column;gap:.25em;margin:.6em auto 0;user-select:none;background:#d6d6de;border-radius:12px;padding:.4em;max-width:40em;border-bottom:8px solid #9a9aa8}
.kr{display:flex;gap:.25em;justify-content:center}
.key{flex:1 1 0;min-width:0;max-width:3.2em;min-height:2.3em;border:0;border-bottom:5px solid #a5a5b3;background:#fff;color:#111;border-radius:7px;font-family:var(--mono);font-weight:700;padding:0;font-size:.9em}
.key:active{transform:translateY(3px);border-bottom-width:2px}
.key.wide{max-width:6em;flex:2 1 0}
.key.space{max-width:16em;flex:6 1 0}
.key.on{background:var(--lime)}
.key.enter{background:var(--good)}
.key .s2{display:block;font-size:.65em;color:#666;line-height:1}

/* 6 noticeboard */
.cork{background:#b57a45;background-image:radial-gradient(rgba(0,0,0,.18) 1px,transparent 1.5px),radial-gradient(rgba(255,255,255,.12) 1px,transparent 1.5px);background-size:9px 9px,13px 13px;border:12px solid #7a4b24;border-radius:10px;padding:.7em}
.pola{background:#fff;color:#333;width:min(13em,90%);margin:.3em auto .6em;padding:.45em .45em .3em;transform:rotate(-2deg);box-shadow:4px 6px 0 rgba(0,0,0,.35);text-align:center;position:relative}
.pola:before{content:"📌";position:absolute;top:-.7em;left:50%;transform:translateX(-50%)}
.pola .ph{background:linear-gradient(#bfe6ff,#e6f7d9);font-size:2.2em;padding:.25em 0}
.pola .cap{font-family:var(--hand);font-size:.85em}
.strip{background:#fffdf5;color:#111;min-height:2.6em;border-radius:4px;padding:.3em .5em;display:flex;flex-wrap:wrap;gap:.3em;align-items:center;box-shadow:3px 5px 0 rgba(0,0,0,.3);margin-bottom:.6em}
.strip .wp{background:#ffe66d;border:0;color:#111;font-weight:700;min-height:40px;padding:0 .6em;border-radius:3px}
.words{display:flex;flex-wrap:wrap;gap:.45em}
.words .sticky.used{visibility:hidden}

/* 7 bin */
.binwrap{display:flex;flex-wrap:wrap;gap:.8em;align-items:flex-end}
.bin{width:6em;flex:none;text-align:center}
.bin .can{height:5.5em;background:linear-gradient(90deg,#1c6b3a,#2fa35c,#1c6b3a);border-radius:6px 6px 14px 14px;border:3px solid #0d3a1f;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;padding:.3em;font-size:1.3em;position:relative}
.bin .can:after{content:"♻️";position:absolute;bottom:.2em;left:0;right:0;font-size:1.1em}
.bin .lid{height:.7em;background:#0d3a1f;border-radius:8px;margin-bottom:2px}
.note{flex:1 1 16em;background:#fffdf5;color:#222;border-radius:4px;padding:.8em 1em;font-family:var(--hand);font-size:1.15em;box-shadow:4px 6px 0 rgba(0,0,0,.35);animation:unfold .7s;background-image:linear-gradient(115deg,transparent 48%,rgba(0,0,0,.06) 50%,transparent 52%),linear-gradient(25deg,transparent 48%,rgba(0,0,0,.05) 50%,transparent 52%)}
@keyframes unfold{from{transform:scale(.3) rotate(-25deg);border-radius:50%;opacity:.3}to{transform:none}}
.squig{border:0;background:transparent;font:inherit;color:#222;text-decoration:underline wavy #d62828;text-underline-offset:6px;text-decoration-thickness:2px;padding:0 .15em;border-radius:50%;min-height:44px}
.squig.on{outline:3px solid #d62828;outline-offset:2px}
.pens{display:flex;flex-wrap:wrap;gap:.45em;margin-top:.6em}
.pen{border:3px solid #d62828;background:var(--panel2);color:#fff;border-radius:999px 10px 10px 999px;min-height:2.2em;padding:0 1em;font-weight:700}
.pen:before{content:"🖊️ "}

/* 8 power */
.bulbrow{display:flex;flex-wrap:wrap;gap:.2em;justify-content:space-around;margin:.2em 0 .6em}
.bulbrow span{font-size:1.8em;filter:grayscale(1) brightness(.4);transition:filter .5s}
.bulbrow span.on{filter:none;text-shadow:0 0 18px #ffd23f}
.plugcard{background:var(--panel2);border:3px solid var(--line);border-radius:14px;padding:.5em .8em;font-size:1.1em;display:flex;flex-wrap:wrap;gap:.35em;align-items:center}
.plugcard .gap{display:inline-flex;align-items:center;justify-content:center;min-width:4.4em;min-height:1.9em;border:3px dashed var(--c);border-radius:10px;font-weight:900}
.cable{display:block;width:100%;height:3em}
.cable path{fill:none;stroke:#888;stroke-width:6;stroke-linecap:round;stroke-dasharray:6 8}
.board{display:flex;flex-wrap:wrap;gap:.4em;background:#e9e9ef;border-radius:14px;padding:.5em;border-bottom:8px solid #9a9aa8;justify-content:center}
.sock{border:0;background:#fff;color:#111;border-radius:10px;min-width:5.2em;min-height:3.2em;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -5px 0 #c8c8d2}
.sock:before{content:"⚡";font-size:.8em;color:#e09b00}

/* 10 headphones */
.hp{display:flex;align-items:center;gap:.6em;background:#000;border:3px solid var(--c);border-radius:999px;padding:.3em .6em;margin:0 0 .6em;flex-wrap:wrap}
.hp .em{font-size:1.8em}
.eq{flex:1;display:flex;gap:3px;align-items:flex-end;height:1.6em;min-width:5em}
.eq i{flex:1;background:var(--c);border-radius:2px;height:20%}
.eq.play i{animation:eqa .7s infinite ease-in-out}
.eq i:nth-child(2n){animation-delay:.15s}.eq i:nth-child(3n){animation-delay:.3s}
@keyframes eqa{50%{height:100%}}
.mock{background:#f4f4f8;color:#111;border:3px solid #111;border-radius:10px;overflow:hidden;font-size:.85em}
.mtop{background:#3d3d3d;color:#fff;display:flex;align-items:center;gap:.4em;padding:.3em .5em;flex-wrap:wrap}
.mtop .lg{font-weight:900;flex:1}
.mrow{display:flex;flex-wrap:wrap}
.mside{display:flex;flex-direction:column;gap:.2em;padding:.4em;background:#e7e7ee;flex:1 1 8em}
.mmain{flex:3 1 14em;padding:.4em}
.hot{border:2px solid #111;background:#fff;border-radius:8px;min-height:44px;padding:0 .6em;font-weight:700;color:#111;text-align:left}
.hot.dark{background:#111;color:#fff}
.mbtns{display:flex;flex-wrap:wrap;gap:.3em;margin:.2em 0 .4em}
.gl{height:.5em;background:#d6d6de;border-radius:4px;margin:.3em 0}

/* 9 clipboard */
.clip{background:#c6935a;border-radius:16px;padding:1.4em .7em .7em;position:relative;max-width:40em;margin:0 auto}
.clip:before{content:"";position:absolute;top:.25em;left:50%;transform:translateX(-50%);width:5em;height:1.2em;background:linear-gradient(#ddd,#999);border-radius:8px;border:2px solid #666}
.sheet{background:#fff;color:#111;border-radius:4px;padding:.5em .6em}
.sheet .mh{font-size:.75em;color:#555;border-bottom:2px solid #ddd;padding-bottom:.3em;margin-bottom:.3em;overflow-wrap:anywhere}
.sl{display:block;width:100%;text-align:left;border:0;background:transparent;color:#111;padding:.15em .3em;min-height:44px;border-radius:4px}
.sl.found{background:#fff176}
